<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Store</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#121212;color:#fff}
.header{padding:16px;font-size:22px;font-weight:bold}
.card{max-width:420px;margin:20px auto;padding:20px}
.top{display:flex;gap:16px;align-items:center}
.icon{width:88px;height:88px;border-radius:20px;background:#2d7df6;display:flex;align-items:center;justify-content:center;font-size:36px}
.name{font-size:26px;font-weight:bold}
.dev{color:#7fb3ff}
.stats{display:flex;justify-content:space-between;margin:22px 0;text-align:center}
.btn{display:block;background:#6ecf68;color:#111;text-decoration:none;text-align:center;padding:14px;border-radius:28px;font-weight:bold}
.shots{display:flex;overflow:auto;gap:12px;margin:20px 0}
.shots img{width:180px;height:320px;border-radius:14px;background:#333}
.about{color:#ccc;line-height:1.5}
</style>
</head>
<body>
<div class="header">App Store</div>
<div class="card">
<div class="top">
<div class="icon">📱</div>
<div>
<div class="name">APP NAME</div>
<div class="dev">Your Studio</div>
</div>
</div>

<div class="stats">
<div><b>4.5★</b><br><small>Rating</small></div>
<div><b>500K+</b><br><small>Downloads</small></div>
<div><b>6.1 MB</b><br><small>Size</small></div>
</div>

<a class="btn" href="APP_LINK">Download</a>

<h3>Screenshots</h3>
<div class="shots">
<img src="SCREENSHOT1" alt="">
<img src="SCREENSHOT2" alt="">
<img src="SCREENSHOT3" alt="">
</div>

<h3>About this app</h3>
<p class="about">Write your app description here.</p>
</div>
</body>
</html>
